# Integration tests: pl_curl against a small SWI-Prolog HTTP server, and the
# PostgreSQL bridge against a PostgreSQL service container.
# Runs in the shared image from the CI_IMAGE repository variable (see image.yaml).
name: it

on:
  push:
    branches: [main]
  pull_request:

jobs:
  curl:
    runs-on: nixos-amd64
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - name: Check out repository code
        env:
          TOKEN: ${{ github.token }}
        run: |
          # plain git instead of actions/checkout: no action clone, no node
          if [ -n "$TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
            export GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          fi
          git init .
          git fetch --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD
          git log -1 --format="checked out %H%n  %s%n  %an, %ci"
          echo "  $(git ls-files | wc -l) files"
      - name: Build
        run: ci/build.sh
      - name: pl_curl against the Prolog fixture server
        run: ci/it-curl.sh

  postgres:
    runs-on: docker
    container:
      image: ${{ vars.CI_IMAGE }}
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    # the service is started with docker by the runner; from the job container
    # it is reachable under its service name
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: plu
          POSTGRES_PASSWORD: plu
          POSTGRES_DB: plu
        options: >-
          --health-cmd "pg_isready -U plu -d plu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: plu
      PGPASSWORD: plu
      PGDATABASE: plu
    steps:
      - name: Check out repository code
        env:
          TOKEN: ${{ github.token }}
        run: |
          # plain git instead of actions/checkout: no action clone, no node
          if [ -n "$TOKEN" ]; then
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraheader
            export GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          fi
          git init .
          git fetch --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git -c advice.detachedHead=false checkout FETCH_HEAD
          git log -1 --format="checked out %H%n  %s%n  %an, %ci"
          echo "  $(git ls-files | wc -l) files"
      - name: Build
        run: ci/build.sh
      - name: pl_postgresql against the PostgreSQL service
        run: ci/it-pgsql.sh
